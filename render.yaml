services:
  - type: web
    name: outland-dayz
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: STEAM_API_KEY
        sync: false
      - key: STEAM_SESSION_SECRET
        generateValue: true
      - key: PAYMENT_MONOBANK_TOKEN
        sync: false
      - key: MONOBANK_WEBHOOK_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_SITE_URL
        value: https://outland-dayz.onrender.com
